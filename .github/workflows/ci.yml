name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prepo/web build
        env:
          # Build-time only — Next.js needs these to be *set*, not correct,
          # to prerender. Nothing here is a real secret.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/prepo
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret-000000000000
          # 32 zero bytes, base64-encoded — syntactically valid for
          # ENCRYPTION_KEY's format check, never used to encrypt anything real.
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  # Stages 02–03 only: filtering, secret redaction, fact extraction. No
  # network, no API key. This is the suite CONTRIBUTING.md refers to as
  # gating prompt/engine changes — the LLM-quality gates in `pnpm eval:full`
  # need a real database and a real model key and are intentionally not run
  # here; see evals/run.ts for why.
  eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.md

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prepo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/prepo
